<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitación interactiva</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#7d45ba,#24133e 75%);font-family:system-ui,sans-serif;color:white;display:grid;place-items:center}.wrap{width:min(100%,490px);padding:12px;text-align:center}video{display:block;width:100%;max-height:82dvh;object-fit:contain;border-radius:18px;background:#000;box-shadow:0 10px 35px #0005}.actions{display:none;padding:12px 0;animation:rise .5s ease}.actions.visible{display:block}.btn{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:16px;font-size:17px;font-weight:700;text-decoration:none;color:#1d1732;background:#f8d869;cursor:pointer}.btn.maps{background:#9ce9ff}.replay{background:transparent;color:white;border:1px solid #ffffff77}.start{margin-top:12px}.hidden{display:none}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}</style></head><body><main class="wrap"><video id="video" playsinline preload="metadata" controls><source src="video_original.mp4" type="video/mp4">Tu navegador no admite videos MP4.</video><button id="start" class="btn start">▶ Reproducir invitación</button><section id="actions" class="actions" aria-live="polite"><h2>¡Te esperamos!</h2><a class="btn" id="rsvp" target="_blank" rel="noopener">Confirmar por WhatsApp</a><a class="btn maps" href="https://maps.app.goo.gl/LCWZMSbkgoxcZdp27" target="_blank" rel="noopener">Ver ubicación en Google Maps</a><button class="btn replay" id="replay">↻ Repetir video</button></section></main><script>const v=document.getElementById('video'),a=document.getElementById('actions'),start=document.getElementById('start');const msg='Hola, confirmo mi asistencia al cumpleaños de Gerardo. Mi nombre es: ';document.getElementById('rsvp').href='https://wa.me/523131119350?text='+encodeURIComponent(msg);function play(){a.classList.remove('visible');start.classList.add('hidden');v.currentTime=0;v.play().catch(()=>start.classList.remove('hidden'))}start.onclick=play;document.getElementById('replay').onclick=play;v.addEventListener('play',()=>start.classList.add('hidden'));v.addEventListener('ended',()=>{a.classList.add('visible');start.classList.add('hidden')});</script></body></html>
